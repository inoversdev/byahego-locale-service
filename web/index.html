<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a3a" />
    <meta name="description" content="Explore the languages and dialects stored in the ByaheGo locale database on an interactive 3D globe." />
    <link rel="icon" type="image/png" href="/favicon-go.png" />
    <title>ByaheGo Locale Globe</title>
  </head>
  <body>
    <a class="skip-link" href="#country-search">Skip to country search</a>

    <main class="app">
      <div id="globe" class="globe" role="img"
           aria-label="Interactive 3D globe of countries. Use the country search to pick a country with the keyboard."></div>

      <header class="top">
        <div class="brand">
          <img class="brand-logo" src="/ByahegoGoGlyph.png" alt="" width="867" height="512" />
          <div>
            <h1>ByaheGo Locale</h1>
            <p class="hint">Drag · scroll to zoom · click a country</p>
          </div>
        </div>

        <div class="search">
          <label for="country-search" class="sr-only">Search countries</label>
          <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
          <input id="country-search" type="text" role="combobox" autocomplete="off" spellcheck="false"
                 placeholder="Search country or code" aria-expanded="false"
                 aria-controls="country-options" aria-autocomplete="list" />
          <ul id="country-options" role="listbox" aria-label="Countries" hidden></ul>
        </div>
      </header>

      <section class="legend" aria-label="Map legend">
        <p class="legend-title">Languages + dialects stored</p>
        <div class="legend-row">
          <span class="swatch swatch-none" aria-hidden="true"></span><span>None</span>
          <span class="ramp" id="ramp" aria-hidden="true"></span>
        </div>
        <div class="legend-scale"><span>Fewer</span><span id="legend-max">More</span></div>
      </section>

      <button id="rotate" class="fab" type="button" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" />
        </svg>
        <span id="rotate-label">Pause rotation</span>
      </button>

      <aside id="panel" class="panel" aria-labelledby="panel-title" tabindex="-1" hidden></aside>

      <div id="tooltip" class="tooltip" role="presentation" hidden></div>
      <div id="status" class="status" role="status"></div>
      <div id="live" class="sr-only" aria-live="polite"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
